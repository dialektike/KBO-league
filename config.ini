; KBO-league 설정 파일
; 이 파일을 수정하면 코드 수정 없이 기본 동작을 변경할 수 있습니다.
; 파일이 없거나 항목이 비어 있으면 settings.py의 fallback 값이 사용됩니다.

[paths]
; 데이터 루트 디렉토리
; 이 경로 아래에 data/game/, data/schedule/ 구조로 저장됩니다.
; 기본값: .
base_dir = .

[network]
; 각 요청 사이 대기 시간 (초)
; KBO 서버에 부담을 주지 않도록 설정합니다.
; 기본값: 0.5
delay = 0.5

[backup]
; 백업 대상 디렉토리 (별도 git 저장소 권장)
; backup.py가 data/game/, data/schedule/을 이 경로로 rsync 동기화합니다.
; 커밋/푸시는 수동으로 수행합니다.
; 예: target_dir = /Users/me/git/KBO_DATA
target_dir =
